<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperJobGenie</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
      font-size: 13px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .logo-text {
      font-weight: 800;
      font-size: 15px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-badge {
      font-size: 10px;
      background: #064e3b;
      color: #34d399;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 700;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }
    .card {
      background: #0f172a;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      border: 1px solid #1e293b;
    }
    .card-title {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .val {
      font-size: 13px;
      font-weight: 700;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .desc {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 6px;
      line-height: 1.45;
    }
    .actions-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary:hover {
      opacity: 0.94;
      transform: translateY(-1px);
    }
    .btn-secondary {
      width: 100%;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #ffffff;
    }
    .footer {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 14px;
    }
    .job-preview {
      display: none;
      background: #1e1b4b;
      border: 1px solid #4338ca;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 11px;
    }
    .job-preview-title {
      font-weight: 700;
      color: #c7d2fe;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-wrap">
      <div class="logo-badge">🚀</div>
      <div class="logo-text">SuperJobGenie</div>
    </div>
    <div class="status-badge">全量内嵌弹窗版</div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>招聘网全量抓取引擎</span>
      <span style="color:#38bdf8;">v2.2.0</span>
    </div>
    <div class="val">✅ 3,000+ 字无损抓取引擎</div>
    <div class="desc">
      打开 Indeed / LinkedIn 等招聘职位详情页，页面右下角将自动挂载 <strong>SuperJobGenie 🚀</strong> 悬浮胶囊，点击即可在页面内直接弹出沉浸式大弹窗！
    </div>
  </div>

  <div id="jobPreviewBox" class="job-preview">
    <div class="job-preview-title" id="previewTitle">检测到当前职位</div>
    <div id="previewMeta" style="color: #94a3b8; font-size: 10px; margin-top: 2px;"></div>
  </div>

  <div class="actions-box">
    <button class="btn-primary" id="openInPageModal">
      ✨ 唤起招聘网页面弹窗 (In-Page Modal)
    </button>
    <button class="btn-secondary" id="openLocalDashboard">
      🚀 打开独立全屏控制台 (本地 Web 版)
    </button>
  </div>

  <div class="footer">
    融合 3000 字全量解析引擎与页面内嵌大弹窗
  </div>

  <script src="popup.js"></script>
</body>
</html>
